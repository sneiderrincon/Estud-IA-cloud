name: SonarQube

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cobertura de la sesión 2
        run: |
          python3 -m venv /tmp/cobertura
          /tmp/cobertura/bin/pip install \
            -r semana-02/sesion-3/backend/requirements.txt \
            psycopg2-binary==2.9.13 \
            pytest \
            pytest-cov \
            httpx
          /tmp/cobertura/bin/pytest \
            semana-02/sesion-3/backend/tests \
            semana-02/sesion-4/demo/tests \
            --cov=semana-02/sesion-3/backend \
            --cov=semana-02/sesion-4/demo \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Cobertura de simple_bk
        run: |
          uv sync --locked --no-build --directory semana-02/ejercicio/simple_bk --group dev
          ./semana-02/ejercicio/simple_bk/.venv/bin/python -m pytest \
            semana-02/ejercicio/simple_bk/tests \
            -v \
            --cov=semana-02/ejercicio/simple_bk \
            --cov-report=xml:coverage-simple-bk.xml \
            --cov-report=term-missing
          python3 - << 'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # El XML de coverage.py deja el archivo como "main.py" y el directorio
          # del paquete en <source>. Sonar compara con la ruta del repo.
          informe = Path("coverage-simple-bk.xml")
          prefijo = "semana-02/ejercicio/simple_bk/"
          arbol = ET.parse(informe)
          raiz_xml = arbol.getroot()
          fuentes = raiz_xml.find("sources")
          for fuente in list(fuentes):
              fuentes.remove(fuente)
          nueva = ET.SubElement(fuentes, "source")
          nueva.text = str(Path.cwd().resolve())
          for clase in raiz_xml.findall(".//class"):
              nombre = clase.get("filename")
              if not nombre.startswith(prefijo):
                  clase.set("filename", prefijo + nombre)
          arbol.write(informe, encoding="unicode", xml_declaration=True)
          PY

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
