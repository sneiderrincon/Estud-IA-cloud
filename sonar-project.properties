sonar.projectKey=RafaelCampoTech_Estud-IA_cloud
sonar.organization=rafaelcampotech


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Estud-IA_cloud
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Cobertura que genera el job de Sonar antes del análisis.
# coverage.xml: sesiones 3 y 4. coverage-simple-bk.xml: semana-02/ejercicio/simple_bk.
sonar.python.coverage.reportPaths=coverage.xml,coverage-simple-bk.xml
sonar.coverage.exclusions=**/tests/**

# La sesión 4 instala psycopg2 con --no-binary a propósito, para que gcc
# entre en la comparación de imágenes. Un --only-binary=:all: o un lock
# de wheels ocultaría esa diferencia, así que esas dos reglas no aplican
# a los Dockerfile del demo.
sonar.issue.ignore.multicriteria=compilar,lockdemo
sonar.issue.ignore.multicriteria.compilar.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.compilar.resourceKey=semana-02/sesion-4/demo/**
sonar.issue.ignore.multicriteria.lockdemo.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.lockdemo.resourceKey=semana-02/sesion-4/demo/**